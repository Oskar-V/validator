name: run-tests
run-name: ${{ github.actor }} requested tests
# Runs on every PR update and every push to main. No path filter: package.json,
# the lockfile, tsconfig, jsr.json, and the workflows themselves all affect the result.
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck (including type-level tests)
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Catches JSR-only problems (unresolvable specifiers, missing exports) before a release
      - name: JSR publish dry run
        run: bunx jsr publish --dry-run
